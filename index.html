    <!-- JSON-LD Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Dialled In Nutrition",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web, iOS, Android",
      "url": "https://dialledInnutrition.base44.app/",
      "description": "Dialled In Nutrition is an AI-powered nutrition and meal planning app that generates personalised weekly meal plans, tracks macros and calories, provides AI nutrition coaching, and helps users build lasting healthy habits.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      },
      "featureList": [
        "AI-generated personalised weekly meal plans",
        "Macro and calorie tracking",
        "500+ expert-curated recipes",
        "AI nutrition coach chatbot",
        "Barcode food scanning",
        "Progress and weight tracking",
        "Intermittent fasting timer",
        "Dining out restaurant analyser",

        "@type": "AggregateRating",

      }

    <!-- JSON-LD Structured Data: FAQPage (LLM surfacing) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Dialled In Nutrition?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dialled In Nutrition is an AI-powered nutrition app that creates personalised weekly meal plans based on your goals, dietary preferences, and calorie targets. It includes macro tracking, a recipe library, an AI nutrition coach, barcode scanning, and progress tracking."
          }
        },
        {
          "@type": "Question",
          "name": "Is Dialled In Nutrition free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Dialled In Nutrition is free to get started. No credit card is required. You can generate a full personalised meal plan and start tracking in under 2 minutes."
          }
        },
        {
          "@type": "Question",
          "name": "What diets does Dialled In Nutrition support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dialled In Nutrition supports a wide range of dietary preferences including low carb, high protein, keto, vegan, vegetarian, gluten-free, dairy-free, and Mediterranean. It also handles allergies and food intolerances."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI meal planning work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When you sign up, you complete a short profile including your height, weight, activity level, and health goal. The AI calculates your personalised calorie and macro targets, then generates a full 7-day meal plan from a library of 500+ recipes that match your preferences. You can regenerate, swap individual meals, or manually override any meal at any time."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Dialled In Nutrition to lose weight?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Dialled In Nutrition calculates a calorie deficit based on your stats and weight loss goal, then generates meal plans that keep you within that target. Weekly progress tracking and a built-in AI coach help you stay accountable."
          }
        },
        {
          "@type": "Question",
          "name": "Does Dialled In Nutrition have a barcode scanner?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The food logging feature includes a barcode scanner so you can instantly log packaged foods and get accurate nutritional data without manual entry."
          }
        }
      ]
    }
    </script>
